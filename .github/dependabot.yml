# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Workspace root: shared dev tooling + lockfile root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
      - workspace-root
    groups:
      dev-types:
        patterns:
          - "@types/*"
      lint-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "lint-staged"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # Toolchain policy (2026-11). Revisit when the blocker clears.
      # @types/node tracks the lowest supported Node major (engines
      # ">=20"); bump it together with the floor, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports typescript ">=4.8.4 <6.1.0";
      # TS 6.1+ / 7 wait for typescript-eslint support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # lint-staged 17 requires Node >=22.22.1; the repo supports Node 20.
      - dependency-name: "lint-staged"
        versions: [">=17.0.0"]
      # These majors require Node >=22 (engines), but CI and `engines`
      # still cover Node 20. Adopt them together with the Node 22 floor.
      - dependency-name: "tsup"
        versions: [">=9.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
      - dependency-name: "msw"
        versions: [">=3.0.0"]
      - dependency-name: "size-limit"
        versions: [">=14.0.0"]
      - dependency-name: "@size-limit/*"
        versions: [">=14.0.0"]

  # @dojocoding/whatsapp-sdk
  - package-ecosystem: npm
    directory: /packages/whatsapp-sdk
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - whatsapp-sdk
    groups:
      dev-types:
        patterns:
          - "@types/*"
      lint-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "fast-check"
          - "msw"
          - "supertest"
          - "@types/supertest"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    ignore:
      # Major-version bumps to peer-dep ecosystems require an explicit
      # decision about widening the supported range; let humans drive
      # those rather than auto-opening a PR.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hono"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]
      # Toolchain policy (2026-11). Revisit when the blocker clears.
      # @types/node tracks the lowest supported Node major (engines
      # ">=20"); bump it together with the floor, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports typescript ">=4.8.4 <6.1.0";
      # TS 6.1+ / 7 wait for typescript-eslint support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # lint-staged 17 requires Node >=22.22.1; the repo supports Node 20.
      - dependency-name: "lint-staged"
        versions: [">=17.0.0"]
      # These majors require Node >=22 (engines), but CI and `engines`
      # still cover Node 20. Adopt them together with the Node 22 floor.
      - dependency-name: "tsup"
        versions: [">=9.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
      - dependency-name: "msw"
        versions: [">=3.0.0"]
      - dependency-name: "size-limit"
        versions: [">=14.0.0"]
      - dependency-name: "@size-limit/*"
        versions: [">=14.0.0"]

  # @dojocoding/whatsapp-mcp
  - package-ecosystem: npm
    directory: /packages/whatsapp-mcp
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - whatsapp-mcp
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      lint-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
    ignore:
      # Toolchain policy (2026-11). Revisit when the blocker clears.
      # @types/node tracks the lowest supported Node major (engines
      # ">=20"); bump it together with the floor, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports typescript ">=4.8.4 <6.1.0";
      # TS 6.1+ / 7 wait for typescript-eslint support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # lint-staged 17 requires Node >=22.22.1; the repo supports Node 20.
      - dependency-name: "lint-staged"
        versions: [">=17.0.0"]
      # These majors require Node >=22 (engines), but CI and `engines`
      # still cover Node 20. Adopt them together with the Node 22 floor.
      - dependency-name: "tsup"
        versions: [">=9.0.0"]
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
      - dependency-name: "msw"
        versions: [">=3.0.0"]
      - dependency-name: "size-limit"
        versions: [">=14.0.0"]
      - dependency-name: "@size-limit/*"
        versions: [">=14.0.0"]

  # GitHub Actions pin updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      # One PR per week for all action bumps (pins are full commit SHAs
      # with a version comment; Dependabot updates both).
      actions:
        patterns:
          - "*"
